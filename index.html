<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e13">
  <title>VARTEX — Modern Streetwear</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e13'/%3E%3Cpath d='M12 16h12l8 26 8-26h12L38 50H26z' fill='%23eef2f6'/%3E%3Cpath d='M36 10 24 34h9l-4 20 14-26h-9z' fill='%232f9bff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="VARTEX home">
      <span>VARTEX</span>
    </a>
    <button class="icon-btn" id="bag-btn" aria-label="Open bag">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="count" id="bag-count" hidden>0</span>
    </button>
  </header>

  <main id="app"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-nav="">Home</a>
    <a href="#/shop" data-nav="shop">Shop</a>
    <a href="#/custom" data-nav="custom">Custom</a>
  </nav>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-label="Shopping bag"></aside>
  <section class="sheet" id="sheet" aria-label="Size guide"></section>

  <script src="products.js"></script>
  <script src="bag.js"></script>
  <script src="checkout.js"></script>
  <script src="custom.js"></script>
  <script src="app.js"></script>
</body>
</html>
